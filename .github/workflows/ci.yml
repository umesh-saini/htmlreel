name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # GitHub's Ubuntu runners restrict user namespaces, which Chrome's sandbox needs.
  HTMLREEL_NO_SANDBOX: '1'

jobs:
  test:
    name: Node ${{ matrix.node }} · system Chrome
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  headless-shell:
    name: Headless shell (beginframe) + example renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js install-browser
      - run: node dist/cli.js doctor
      - run: npm test
      - name: Render the examples
        run: |
          node dist/cli.js render examples/youtube-intro/index.html --preset hd --duration 6 -o out/youtube-intro.mp4
          node dist/cli.js render examples/instagram-reel/index.html --preset reel --audio examples/assets/beat.mp3 \
            --captions examples/instagram-reel/captions.srt --duration 10 -o out/instagram-reel.mp4
          node dist/cli.js still examples/youtube-intro/index.html --preset youtube -t 3 --duration 6 -o out/thumbnail.png
      - uses: actions/upload-artifact@v4
        with:
          name: example-renders
          path: out/
